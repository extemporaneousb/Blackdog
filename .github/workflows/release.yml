name: Runtime release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test repository
        run: make test
      - name: Build reproducible archive
        run: make release
      - name: Verify external artifact lifecycle
        run: python3 scripts/acceptance_runtime.py --artifact dist/blackdog.pyz --samples 1 --output dist/runtime-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackdog-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            dist/blackdog.pyz
            dist/blackdog.pyz.sha256
            dist/runtime-acceptance.json
          if-no-files-found: error
