[project]
name = "Blackdog"
profile_version = 1

[paths]
control_dir = "@git-common/blackdog"
worktrees_dir = "../.worktrees"

[taxonomy]
validation_commands = ["PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py'"]
doc_routing_defaults = ["AGENTS.md", "docs/INDEX.md", "docs/ARCHITECTURE.md", "docs/CLI.md", "docs/FILE_FORMATS.md"]

[[handlers]]
id = "blackdog"
kind = "blackdog-runtime"
enabled = true
source_mode = "installed-runtime"
